services:
  - type: web
    name: orbit-backend-engine
    env: python
    region: oregon
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.8
      - key: YT_COOKIES_FILE
        sync: false
      - key: YT_PO_TOKEN
        sync: false
      - key: INSTAGRAM_COOKIE
        sync: false
